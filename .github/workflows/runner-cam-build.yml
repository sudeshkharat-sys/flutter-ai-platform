name: Runner Cam build (exe + apk)

on:
  workflow_dispatch:
  push:
    branches: [sudesh/live-feed-runner-experiment]
    paths: ["pc_runner/**", ".github/workflows/runner-cam-build.yml"]

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r pc_runner/requirements.txt
      - run: python -m PyInstaller --noconfirm runner.spec
        working-directory: pc_runner
      - uses: actions/upload-artifact@v4
        with: { name: runner-exe, path: pc_runner/dist/runner.exe }

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Generate native scaffolding and patch manifest
        working-directory: pc_runner/runner_cam_app
        run: |
          flutter create --project-name runner_cam --org com.example --platforms android .
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <application android:usesCleartextTraffic="true"#' $M
          sed -i 's#android:label="[^"]*"#android:label="Runner Cam"#' $M
          grep -n "Cleartext\|CAMERA\|label" $M
      - name: Build APK
        working-directory: pc_runner/runner_cam_app
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: { name: runner-cam-apk, path: pc_runner/runner_cam_app/build/app/outputs/flutter-apk/app-release.apk }
